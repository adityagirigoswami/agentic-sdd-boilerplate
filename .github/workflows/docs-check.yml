name: docs-check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Docs structure, status consistency, links
        run: python3 scripts/docs_check.py
      - name: .claude/ generated from .agents/
        run: python3 scripts/sync_agents.py --check
